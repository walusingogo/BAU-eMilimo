services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-emilimo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.cluster
    restart: unless-stopped
    expose: ["5001"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emilimo_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET}
      Platform__ApplicationName: ${PLATFORM_APPLICATION_NAME:-BAU.BusinessPlatform}
      Platform__Instance: ${PLATFORM_INSTANCE:-production}
      Platform__DeploymentId: ${PLATFORM_DEPLOYMENT_ID:?Set PLATFORM_DEPLOYMENT_ID}
      Platform__SharedDataPath: /app/shared-data
      FileStorage__SharedRoot: /app/shared-data/uploads
      License__IdentityMode: Deployment
      Redis__Enabled: "true"
      Redis__ConnectionString: redis:6379,password=${CACHE_PASSWORD:?Set CACHE_PASSWORD},abortConnect=false,connectTimeout=5000,syncTimeout=5000
      Redis__InstanceName: "emilimo:${PLATFORM_INSTANCE:-production}:"
    volumes:
      - shared_data:/app/shared-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: valkey/valkey:8.1.10-alpine3.24@sha256:32627109abf6f741121096b45c732f758876803efd7b2e1018ebc0350d117119
    platform: linux/amd64
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${CACHE_PASSWORD}"]
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:?Set CACHE_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$${CACHE_PASSWORD}\" valkey-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./deployment/nginx.cluster.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]

volumes:
  postgres_data:
  shared_data:
  redis_data:
