services:
  postgres:
    image: postgres:15-alpine
    container_name: ucp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ucp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ucp_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ucp_api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ucp_db;Username=postgres;Password=postgres
      - Jwt__Secret=YourSuperSecretKeyHereAtLeast32CharactersLong!
      - Frontend__Url=http://localhost:3000
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ucp_network

volumes:
  postgres_data:
  uploads_data:

networks:
  ucp_network:
    driver: bridge